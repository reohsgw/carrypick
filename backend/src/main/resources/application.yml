server:
  port: ${PORT:8080}

spring:
  application:
    name: carrypick-api
  # Default profile: in-memory H2 so the API runs with zero setup.
  # Use the "postgres" profile (below) for the real database.
  datasource:
    url: jdbc:h2:mem:carrypick;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: true
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  # Allowed front-end origins (comma separated)
  cors-origins: http://localhost:5173,http://127.0.0.1:5173,http://192.168.*:5173
  jwt:
    # Change for any shared deployment. Must be at least 32 characters.
    secret: ${JWT_SECRET:carrypick-dev-secret-change-me-0123456789abcdef}
    ttl-hours: 72
  upload-dir: ${UPLOAD_DIR:uploads}
  seed-demo-data: true
  pricing:
    fee-rate: 0.10              # platform fee r, applied to (budget + reward)
    tax-threshold-krw: 150000   # estimated tax/duty shown only above this item price
    tax-rate: 0.10              # placeholder estimate, not an official customs rate
  payment:
    # mock  = built-in fake payment page (works offline, no keys needed)
    # toss  = Toss Payments test mode (set TOSS_CLIENT_KEY / TOSS_SECRET_KEY test keys)
    mode: ${PAYMENT_MODE:mock}
    toss-client-key: ${TOSS_CLIENT_KEY:}
    toss-secret-key: ${TOSS_SECRET_KEY:}
    toss-confirm-url: https://api.tosspayments.com/v1/payments/confirm
  ai:
    # mock      = returns a clearly-labelled sample receipt (no key needed, works offline)
    # anthropic = reads the real photo with Claude vision (set ANTHROPIC_API_KEY)
    provider: ${AI_PROVIDER:mock}
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${AI_MODEL:claude-haiku-5-5}
    api-url: https://api.anthropic.com/v1/messages
  # KRW per 1 unit of each currency, used to estimate the receipt total in won.
  # These are fixed demo values, not live rates — update them before a demo.
  fx:
    KRW: 1
    JPY: 9.2
    USD: 1380
    EUR: 1500
    GBP: 1750
    THB: 40
    VND: 0.055
    IDR: 0.085
    TWD: 43
    CNY: 190
    HKD: 177
    SGD: 1030

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carrypick}
    username: ${DB_USER:carrypick}
    password: ${DB_PASSWORD:carrypick}
  jpa:
    hibernate:
      ddl-auto: update
